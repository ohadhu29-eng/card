<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אוהד חוטה | כרטיס ביקור דיגיטלי</title>

  <style>
    body { margin:0; background:#000; }
    .card {
      display:flex;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      height:100vh;
      -webkit-overflow-scrolling: touch;
    }
    .slide {
      position:relative;
      flex:0 0 100vw;
      height:100vh;
      scroll-snap-align:start;
    }
.slide img{
  width:100%;
  height:100%;
  object-fit: contain;
  display:block;
  pointer-events:none;
}

  .tap {
  position:absolute;
  z-index:30;
}
    /* Back: טלפון (תשאיר כמו שעבד לך) */
.tap-phone { left:56%; top:49%; width:38%; height:3%; z-index:20; }

    /* Back: אימייל – נתחיל גבוה יותר כדי לצאת מהשחור */
 .tap-email { left:56%; top:57%; width:38%; height:6%; z-index:30; }

    /* Back: שמירת איש קשר (VCF) */
    .tap-vcf  { left:56%; top:76%; width:38%; height:10%; }
  </style>
</head>

<body>
  <div class="card">
    <!-- דף 1 -->
    <div class="slide">
      <img src="front.png" alt="Front">
    </div>

    <!-- דף 2 -->
    <div class="slide">
      <img src="back.png" alt="Back">

      <a class="tap tap-phone" href="tel:+972543089997" aria-label="Call"></a>
      <a class="tap tap-email" href="mailto:ohadh@hotmail.com" aria-label="Email"></a>
      <a class="tap tap-vcf"  href="ohad.vcf" download aria-label="Save Contact"></a>
    </div>
  </div>
</body>
</html>
